<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Admin Login</title>
  <style>
    :root {
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #334155;
      --text-dark: #0f172a;
      --border-color: #e2e8f0;
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-card {
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-header h1 {
      font-size: 1.5rem;
      color: var(--text-dark);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 0.88rem;
      color: #64748b;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .form-group input {
      padding: 10px 14px;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.15);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 6px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert-error {
      background-color: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
    }

    .nav-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 0.88rem;
      color: #64748b;
      text-decoration: none;
    }

    .nav-link:hover {
      color: var(--primary);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h1>Team Admin Login</h1>
      <p>Sign in to submit match results & manage team details</p>
    </div>

    <div id="error-alert" class="alert-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="captain@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" id="submit-btn" class="btn-submit">Sign In</button>
    </form>

    <a href="index.html" class="nav-link">&larr; Return to Main Portal</a>
  </div>

  <script type="module">
    import { supabase } from "./supabase.js";

    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const errorAlert = document.getElementById('error-alert');

    // 1. Auto-redirect if already logged in
    async function checkExistingSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = "admin.html";
      }
    }

    // 2. Login submit handler
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: emailInput.value,
          password: passwordInput.value,
        });

        if (error) throw error;

        // Redirect to admin portal on successful authentication
        window.location.href = "admin.html";

      } catch (err) {
        errorAlert.textContent = err.message || 'Invalid login credentials.';
        errorAlert.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    document.addEventListener('DOMContentLoaded', checkExistingSession);
  </script>
</body>
</html>
