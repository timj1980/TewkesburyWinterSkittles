<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>League Fixtures & Score Status - Admin</title>
  <style>
    :root {
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --admin-color: #2563eb;
      --admin-hover: #1d4ed8;
      --team-color: #059669;
      --team-hover: #047857;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #334155;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      padding: 24px 16px;
      max-width: 1100px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      overflow: hidden;
      padding: 20px;
    }

    h1 { font-size: 1.4rem; color: var(--text-dark); margin-bottom: 10px; }

    .filter-bar {
      margin: 15px 0;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, input {
      padding: 6px 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      text-align: left;
    }

    th {
      background-color: #f1f5f9;
      font-weight: bold;
      color: var(--text-dark);
    }

    /* Color Status Classes */
    .status-has-scores {
      background-color: #d4edda !important;
      color: #155724;
    }

    .status-result-summary {
      background-color: #ffe8cc !important;
      color: #d97706;
      font-weight: bold;
    }

    .status-missing-scores {
      background-color: #f8d7da !important;
      color: #721c24;
      font-weight: bold;
    }

    .status-upcoming {
      background-color: #ffffff !important;
      color: var(--text-main);
    }

    .badge-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-green { background: #28a745; color: #fff; }
    .badge-orange { background: #f59e0b; color: #fff; }
    .badge-red { background: #dc3545; color: #fff; }
    .badge-white { background: #e0e0e0; color: #333; }

    tr.status-has-scores, tr.status-result-summary, tr.status-missing-scores {
      cursor: pointer;
      transition: filter 0.15s ease;
    }

    tr.status-has-scores:hover, tr.status-result-summary:hover, tr.status-missing-scores:hover {
      filter: brightness(0.95);
    }

    .action-link {
      font-weight: bold;
      text-decoration: underline;
    }

    #auth-loader {
      position: fixed;
      inset: 0;
      background-color: var(--bg-body);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-dark);
      z-index: 999;
    }
  </style>
</head>

<body>

  <!-- AUTH CHECK SCREEN -->
  <div id="auth-loader">Checking authorization...</div>

  <div class="container" id="admin-content" style="display: none;">

    <!-- INJECTED ADMIN NAVIGATION & HEADER -->
    <div id="admin-nav-placeholder"></div>

    <!-- MAIN CONTENT CARD -->
    <div class="card">
      <h1>All Teams – Fixtures & Score Status</h1>

      <div class="badge-container">
        <span class="badge badge-green">Green = Full Scorecard</span>
        <span class="badge badge-orange">Orange = Results Summary</span>
        <span class="badge badge-red">Red = Past Match (Missing Scores)</span>
        <span class="badge badge-white">White = Fixture To Play</span>
      </div>

      <div class="filter-bar">
        <label><strong>Filter by Team:</strong>
          <select id="teamFilter">
            <option value="ALL">-- All Teams --</option>
          </select>
        </label>

        <label><strong>Filter Status:</strong>
          <select id="statusFilter">
            <option value="ALL">-- All Statuses --</option>
            <option value="status-missing-scores">Missing Scores Only (Red)</option>
            <option value="status-result-summary">Results Summary Only (Orange)</option>
            <option value="status-has-scores">Full Scorecard Only (Green)</option>
            <option value="status-upcoming">Upcoming Only (White)</option>
          </select>
        </label>
      </div>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Home Team</th>
            <th>Away Team</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="allFixturesBody">
          <tr><td colspan="4">Loading league fixtures...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script type="module">
    import { supabase } from "./supabase.js";

    async function initPage() {
      // 1. Fetch and inject shared AdminNav
      try {
        const res = await fetch("adminnav.html");
        document.getElementById("admin-nav-placeholder").innerHTML = await res.text();
      } catch (err) {
        console.error("Failed to load AdminNav.html:", err);
      }

      // 2. Check Auth Session
      const { data: { session }, error } = await supabase.auth.getSession();

      if (error || !session) {
        window.location.href = "login.html";
        return;
      }

      const userEmailDisplay = document.getElementById('user-email-display');
      if (userEmailDisplay) userEmailDisplay.textContent = session.user.email;

      // 3. Load user roles & permissions
      await loadUserPermissions(session.user.id);

      // 4. Setup Logout button handler from AdminNav
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          await supabase.auth.signOut();
          window.location.href = "login.html";
        });
      }

      // 5. Highlight active link in Nav
      const currentPage = window.location.pathname.split("/").pop().toLowerCase();
      document.querySelectorAll(".nav-bar .nav-link").forEach(link => {
        const href = link.getAttribute("href").toLowerCase();
        if (href === currentPage) {
          link.style.filter = "brightness(1.15)";
          link.style.outline = "2px solid white";
        }
      });

      // 6. Reveal page content
      document.getElementById('auth-loader').style.display = 'none';
      document.getElementById('admin-content').style.display = 'flex';

      // 7. Load fixtures data
      await loadAllLeagueFixtures();
    }

    async function loadUserPermissions(userId) {
      const userRoleBadge = document.getElementById('user-role-badge');
      const siteAdminNavBar = document.getElementById('site-admin-nav-bar');
      const teamAdminNavBar = document.getElementById('team-admin-nav-bar');

      try {
        const { data, error } = await supabase
          .from('user_roles')
          .select('role')
          .eq('user_id', userId)
          .maybeSingle();

        if (error) console.error('Supabase query error:', error);

        if (data && data.role === 'admin') {
          if (userRoleBadge) {
            userRoleBadge.textContent = 'Site Admin';
            userRoleBadge.style.backgroundColor = '#2563eb';
          }
          if (siteAdminNavBar) siteAdminNavBar.style.display = 'flex';
          if (teamAdminNavBar) teamAdminNavBar.style.display = 'flex';
        } else if (data && data.role === 'captain') {
          if (userRoleBadge) {
            userRoleBadge.textContent = 'Team Captain';
            userRoleBadge.style.backgroundColor = '#059669';
          }
          if (siteAdminNavBar) siteAdminNavBar.style.display = 'none';
          if (teamAdminNavBar) teamAdminNavBar.style.display = 'flex';
        } else {
          if (userRoleBadge) userRoleBadge.textContent = 'User';
          if (siteAdminNavBar) siteAdminNavBar.style.display = 'none';
          if (teamAdminNavBar) teamAdminNavBar.style.display = 'none';
        }
      } catch (err) {
        console.error('Error fetching role:', err);
      }
    }

    // --- FIXTURES STATUS LOGIC ---
    async function fetchTeams() {
      const { data, error } = await supabase
        .from("Teams")
        .select('"Team Name"')
        .order('"Team Name"', { ascending: true });

      if (error || !data) return [];
      return data.map(t => t["Team Name"]);
    }

    function normaliseDate(str) {
      if (!str) return "";
      const match = str.match(/\d{1,2}-\d{1,2}-\d{4}/);
      if (!match) return str;
      let [dd, mm, yyyy] = match[0].split("-");
      if (dd.length === 1) dd = "0" + dd;
      if (mm.length === 1) mm = "0" + mm;
      return `${yyyy}-${mm}-${dd}`;
    }

    let allRowsData = [];

    async function loadAllLeagueFixtures() {
      const tbody = document.getElementById("allFixturesBody");
      const teamFilter = document.getElementById("teamFilter");

      const teamsList = await fetchTeams();
      if (teamsList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4">Failed to load teams list.</td></tr>`;
        return;
      }

      teamsList.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = t;
        teamFilter.appendChild(opt);
      });

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const teamPromises = teamsList.map(async (teamName) => {
        const { data: fixtures, error } = await supabase.rpc("tmsl_get_allfixtures", {
          team: teamName
        });

        if (error || !fixtures) return [];

        return Promise.all(
          fixtures.map(async (fx) => {
            const isoDate = normaliseDate(fx.game_date);
            const matchDate = new Date(isoDate);

            let rowClass = "status-upcoming";
            let statusText = "Upcoming";

            if (matchDate <= today) {
              const { data: scores } = await supabase.rpc("tmsl_get_match_scores_with_summary", {
                team_namein: teamName,
                game_date: isoDate
              });

              if (scores && scores.length > 0) {
                const sampleRow = scores[0];
                const isSummary = sampleRow.homeball1 === null;

                if (isSummary) {
                  rowClass = "status-result-summary";
                  statusText = "Results Summary";
                } else {
                  rowClass = "status-has-scores";
                  statusText = "Scores Available";
                }
              } else {
                rowClass = "status-missing-scores";
                statusText = "Missing Scores";
              }
            }

            const isHome = fx.home_away === 'H' || fx.home_away === 'Home';

            return {
              team: teamName,
              gameDate: fx.game_date,
              isoDate: isoDate,
              homeTeam: isHome ? teamName : fx.opposition,
              awayTeam: isHome ? fx.opposition : teamName,
              statusText: statusText,
              rowClass: rowClass
            };
          })
        );
      });

      const results = await Promise.all(teamPromises);
      
      const seenMatches = new Set();
      allRowsData = results.flat().filter(item => {
        const matchKey = [item.gameDate, item.homeTeam, item.awayTeam].sort().join("|");
        if (seenMatches.has(matchKey)) return false;
        seenMatches.add(matchKey);
        return true;
      });

      allRowsData.sort((a, b) => new Date(a.isoDate) - new Date(b.isoDate));

      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("allFixturesBody");
      const selectedTeam = document.getElementById("teamFilter").value;
      const selectedStatus = document.getElementById("statusFilter").value;

      const filtered = allRowsData.filter(r => {
        const matchTeam = selectedTeam === "ALL" || r.homeTeam === selectedTeam || r.awayTeam === selectedTeam;
        const matchStatus = selectedStatus === "ALL" || r.rowClass === selectedStatus;
        return matchTeam && matchStatus;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4">No matching fixtures found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(r => {
        let actionHtml = r.statusText;
        let targetUrl = "";

        if (r.rowClass === "status-has-scores") {
          targetUrl = `MatchViewer.html?team=${encodeURIComponent(r.team)}&date=${encodeURIComponent(r.isoDate)}`;
          actionHtml = `<span class="action-link">View Scoresheet ↗</span>`;
        } else if (r.rowClass === "status-result-summary") {
          targetUrl = `MatchViewer.html?team=${encodeURIComponent(r.team)}&date=${encodeURIComponent(r.isoDate)}`;
          actionHtml = `<span class="action-link">Results Summary ↗</span>`;
        } else if (r.rowClass === "status-missing-scores") {
          targetUrl = `Upload.html?team=${encodeURIComponent(r.team)}&date=${encodeURIComponent(r.isoDate)}`;
          actionHtml = `<span class="action-link">Add Scores ↗</span>`;
        }

        return `
          <tr class="${r.rowClass}" ${targetUrl ? `data-url="${targetUrl}"` : ""}>
            <td>${r.gameDate}</td>
            <td><strong>${r.homeTeam}</strong></td>
            <td><strong>${r.awayTeam}</strong></td>
            <td>${actionHtml}</td>
          </tr>
        `;
      }).join("");

      tbody.querySelectorAll("tr[data-url]").forEach(row => {
        row.addEventListener("click", () => {
          window.location.href = row.getAttribute("data-url");
        });
      });
    }

    document.getElementById("teamFilter").addEventListener("change", renderTable);
    document.getElementById("statusFilter").addEventListener("change", renderTable);

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
